# Clips pedidos desde el chat (15/10): cada 15 min corta los tramos pendientes (tabla clips) desde los
# originales en Drive y los sube a WordPress. Sin computadora nuestra.
name: recortar-pendientes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  recortar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Procesar clips pedidos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          PUBLICAR_WORDPRESS: ${{ secrets.PUBLICAR_WORDPRESS }}
        run: |
          pip install -q google-auth google-auth-oauthlib google-api-python-client
          python procesar_clips.py

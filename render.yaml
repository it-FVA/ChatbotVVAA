# (21/10) Despliegue de la API en Render (Blueprint). Plan gratuito para probar: 512 MB y se duerme a los 15 min sin uso
# (la primera llamada después tarda ~1 min: despierta y recarga el corpus). La API mide ~400 MB con la búsqueda híbrida:
# si el free no alcanza, pasar a Standard o mover los embeddings a Supabase (plan de la interfaz propia, §3).
# Las variables con sync: false se cargan a mano en el panel de Render (Environment → Add from .env, pegando api.env,
# que se genera en local con `python api/armar_env.py` y NO va al repo).
# (3/11) El bloque envVars se GENERA desde api/variables_entorno.py (python api/generar_config.py); no editarlo a mano.
# /salud/servicios (fila «variables») avisa cuáles faltan en Render. Opcional, no incluida: VECTORES=supabase (vectores en
# pgvector en vez del .npy: -52 MB de RAM, misma calidad medida; lo decide Franco, informes/medicion-vectores-supabase-validado.md).
services:
  - type: web
    name: fva-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      # >>> generado (api/variables_entorno.py: no editar a mano; correr python api/generar_config.py)
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # (21/10) Configuración NO secreta, administrada desde acá.
      - key: ASISTENTE_MODELO
        value: "gpt-5.6-sol"
      - key: BUSQUEDA_HIBRIDA
        value: "1"
      - key: LIMPIEZA_EXTRA
        value: "1"
      - key: RERANK_CANDIDATOS
        value: "50"
      - key: RERANK_CHARS
        value: "400"
      - key: RERANK_MODO
        value: "fusion"
      - key: EXPANSION_CONSULTA
        value: "0"
      - key: CONCEPTOS_URL
        value: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxLDWgltMTAH6-Nu8rVB0e0QM6PgwvemkKEN78rOq7Bk0qyL-895nQ9zjzrPhvF9JNHy082O4DtN8X/pub?gid=528104219&single=true&output=csv"
      - key: DISTINCIONES_URL
        value: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSxLDWgltMTAH6-Nu8rVB0e0QM6PgwvemkKEN78rOq7Bk0qyL-895nQ9zjzrPhvF9JNHy082O4DtN8X/pub?gid=222457179&single=true&output=csv"
      - key: COOKIE_SEGURA
        value: "1"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CORS_ORIGENES
        value: "https://chatbot-vvaa.vercel.app"
      - key: WEB_URL
        value: "https://chatbot-vvaa.vercel.app"
      - key: SESION_SECRETO
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: "975482475680-o1clpt1idim34dormtuecg58knnga3ol.apps.googleusercontent.com"
      - key: DOMINIO_FVA
        value: "viviragradecidos.org"
      # Token para consultar /salud/servicios desde un monitor externo sin sesión (?token= o X-Salud-Token).
      - key: SALUD_TOKEN
        sync: false
      # Límite de memoria del plan (MB), para la fila «memoria» de /salud/servicios (aviso al 80 %, error al 95 %).
      - key: MEMORIA_LIMITE_MB
        value: "512"
      # (22/10, salud) Vencimiento del token de Instagram Login (dura 60 días); corregirlo al renovar el token.
      - key: META_IG_TOKEN_VENCE
        value: "2026-11-22"
      # (2/11, Franco) real: el aprobador publica la entrada de verdad desde la plataforma (o la programa).
